name: Release to crates.io

on:
  push:
    tags:
      - 'v*.*.*'   # e.g. v0.1.0, v1.2.3

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Show Rust version
        run: rustc --version

      # Optional but nice: ensure tag version == Cargo.toml version
      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag version: $TAG_VERSION"

          TOML_VERSION=$(sed -n '/\[workspace.package\]/,/\[/s/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "Cargo.toml version: $TOML_VERSION"

          if [ "$TAG_VERSION" != "$TOML_VERSION" ]; then
            echo "Error: tag version ($TAG_VERSION) does not match Cargo.toml version ($TOML_VERSION)"
            exit 1
          fi

      - name: Run tests
        run: cargo test --all --locked

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          crate_version_exists() {
            local crate="$1"
            local version="$2"

            # Probe crates.io directly. We deliberately do NOT use
            # `cargo info` / `cargo search`: `cargo info "<crate>@<version>"`
            # resolves against the current workspace when a local manifest
            # declares that exact version, so it returns success for the
            # version we're *about* to publish — falsely reporting "already
            # exists" and silently skipping every cargo publish. See the
            # v0.0.4 release run, which "succeeded" without publishing
            # anything.
            #
            # Contract: exit 0 iff the version is live on crates.io.
            # Implementation: read the HTTP status directly via --write-out
            # so 404 (the expected "not published yet" case used by
            # `publish_if_needed`'s pre-check) is silent noise-free, while
            # anything else surfaces loudly on stderr.
            local url="https://crates.io/api/v1/crates/${crate}/${version}"
            local http_code
            http_code=$(curl \
              --silent --show-error \
              --output /dev/null --write-out '%{http_code}' \
              --user-agent "fialucci-allora-release-check" \
              --retry 3 --retry-delay 5 --retry-connrefused \
              --max-time 30 \
              "${url}" || echo "000")
            case "${http_code}" in
              200) return 0 ;;        # version live on crates.io
              404) return 1 ;;        # cleanly absent (no stderr noise)
              000)
                # curl itself failed (DNS, TLS, connection) even after retries.
                # Bail loudly — better than silently skipping a publish.
                echo "crate_version_exists: probe to ${url} failed (no HTTP response after retries)" >&2
                return 1
                ;;
              *)
                # 5xx that survived retries, 403, redirect — surface so a
                # human can investigate rather than silently treat as absent.
                echo "crate_version_exists: unexpected HTTP ${http_code} for ${url}" >&2
                return 1
                ;;
            esac
          }

          wait_for_crate() {
            local crate="$1"
            local version="$2"
            local max_attempts=10
            local delay=10

            echo "Waiting for crates.io to index ${crate} v${version}..."
            for attempt in $(seq 1 "${max_attempts}"); do
              if crate_version_exists "${crate}" "${version}"; then
                echo "${crate} v${version} is now visible on crates.io (attempt ${attempt})."
                return 0
              fi

              echo "${crate} v${version} not visible yet (attempt ${attempt}/${max_attempts}). Sleeping ${delay}s..."
              sleep "${delay}"

              # Exponential backoff, capped at 80s (10 → 20 → 40 → 80).
              if [ "${delay}" -lt 80 ]; then
                delay=$((delay * 2))
              fi
            done

            echo "Timed out waiting for ${crate} v${version} to appear on crates.io."
            return 1
          }

          # Version to publish (from workspace.package)
          VERSION=$(sed -n '/\[workspace.package\]/,/\[/s/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "Publishing Allora crates at version ${VERSION}"

          publish_if_needed() {
            local crate="$1"
            local path="$2"

            if crate_version_exists "${crate}" "${VERSION}"; then
              echo "${crate} v${VERSION} already exists on crates.io, skipping publish."
              return 0
            fi

            echo "Publishing ${crate} v${VERSION} from ${path}..."
            cargo publish --locked --manifest-path "${GITHUB_WORKSPACE}/${path}/Cargo.toml"
            wait_for_crate "${crate}" "${VERSION}"
          }

          # Publish core primitives first
          publish_if_needed "allora-core" "crates/core"

          # Publish macros (independent of http/runtime order)
          publish_if_needed "allora-macros" "crates/macros"

          # Publish HTTP adapters (depends on allora-core)
          publish_if_needed "allora-http" "crates/http"

          # Publish runtime (depends on core + http)
          publish_if_needed "allora-runtime" "crates/runtime"

          # Publish umbrella allora crate last
          publish_if_needed "allora" "crates/allora"
