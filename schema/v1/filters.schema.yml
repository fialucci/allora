# Allora Filters Collection Schema (v1)
# Represents multiple filter definitions sharing a version declaration.
# Reuses the single filter schema's `filter` object shape for each entry.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "local://schemas/v1/filters.schema.yml"

title: "Allora Filters Collection Schema (v1)"
description: "Collection of filter definitions using v1 filter object shape"
type: object
required: [ version, filters ]
additionalProperties: false

properties:
  version:
    type: integer
    const: 1
    default: 1
  filters:
    type: array
    minItems: 1
    description: "List of filter definitions (from + when required; to optional)."
    items:
      $ref: "local://schemas/v1/filter.schema.yml#/properties/filter"

examples:
  - version: 1
    filters:
      - from: inbound.orders
        to: vetted.orders
        when: body.contains("KEEP") && exists(header("Trace-Id"))
      - from: inbound.audit
        when: exists(header("Audit-Flag")) && header("Audit-Flag") == "true"

