# Allora HTTP Outbound Adapters Collection DSL Schema (v1)
# Defines a collection of HTTP outbound adapters.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "local://schemas/v1/http-outbound-adapters.schema.yml"

title: "Allora HTTP Outbound Adapters Collection Specification v1"
description: "Collection of HTTP outbound adapter definitions"
type: object
required: [ version, http-outbound-adapters ]
additionalProperties: false

properties:
  version:
    type: integer
    const: 1
    description: "Schema version (must be 1)."

  http-outbound-adapters:
    type: array
    minItems: 1
    description: "List of HTTP outbound adapter definitions"
    items:
      type: object
      required: [ host, port ]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: |
            Optional explicit adapter identifier. Must be non-empty when present.
            Must be unique across the collection; missing ids may be auto-generated.
        host:
          type: string
          minLength: 1
          description: "Remote host or IP (e.g. 127.0.0.1)."
          default: 127.0.0.1
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: "Remote TCP port."
          default: 80
        base-path:
          type: string
          minLength: 1
          pattern: '^/.*'
          description: "Leading path prefix (must start with '/')."
          default: "/"
        path:
          type: string
          minLength: 1
          pattern: '^/.*'
          description: "Optional trailing path segment appended to base-path."
        method:
          type: string
          enum: [ GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD ]
          description: "HTTP method for outbound requests."
          default: POST
        use-out-msg:
          type: boolean
          description: |
            If true (default) serialize exchange.out_msg when present, else exchange.in_msg.
          default: true
        # Reserved future fields: headers, timeout-ms, retry-policy, auth-ref

examples:
  - version: 1
    http-outbound-adapters:
      - id: http.outboundEcho
        host: 127.0.0.1
        port: 18080
        base-path: /api
        path: /echo
        method: POST
      - host: api.service.internal
        port: 443
        base-path: /v1
        method: GET

