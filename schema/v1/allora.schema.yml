# Allora Root Configuration Schema (documentation-only, v1)
# Single top-level object containing ONLY 'version' and a 'channels' array.
# The channels array shape is reused from channels.schema.yml to keep a single source of truth.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "local://schemas/v1/allora.schema.yaml"

title: "Allora Root Configuration Schema (v1)"
description: "Top-level Allora configuration; only one channels component allowed."
type: object
required: [ version, channels ]
additionalProperties: false

properties:
  version:
    type: integer
    const: 1
    default: 1
    description: "Schema version; must be 1."
  channels:
    # Reuse the array definition from channels.schema.yml (its channels property)
    $ref: "local://schemas/v1/channels.schema.yaml#/properties/channels"
    description: "Collection of channel definitions."
  filters:
    # Optional collection of filters reusing filters.schema.yml
    $ref: "local://schemas/v1/filters.schema.yml#/properties/filters"
    description: "Optional collection of filter definitions (message filter expressions)."
  service-activators:
    # Optional collection of service activators reusing service-activators.schema.yml
    $ref: "local://schemas/v1/service-activators.schema.yml#/properties/service-activators"
    description: "Optional collection of service activator definitions (runtime processors)."
  http-inbound-adapters:
    # Optional collection of HTTP inbound adapters reusing http-inbound-adapters.schema.yml
    $ref: "local://schemas/v1/http-inbound-adapters.schema.yml#/properties/http-inbound-adapters"
    description: "Optional collection of HTTP inbound adapters (HTTP endpoints mapping to channels)."

examples:
  - version: 1
    channels:
      - kind: direct
        id: inbound.orders
      - kind: direct
        id: processed.orders
      - kind: direct
        id: error.deadletter
    http-inbound-adapters:
      - id: http.receiveGateway
        host: 127.0.0.1
        port: 8080
        path: /receiveGateway
        methods: [ POST ]
        request-channel: receiveChannel
        reply-channel: replyChannel
    filters:
      - id: filt.orders
        from: inbound.orders
        to: processed.orders
        when: body.contains("KEEP") && exists(header("Trace-Id"))
