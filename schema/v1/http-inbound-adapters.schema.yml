# Allora HTTP Inbound Adapters Collection Schema (v1)
# Represents multiple HTTP inbound adapter definitions sharing a single version declaration.
# Reuses the single http inbound adapter schema's object shape for each entry.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "local://schemas/v1/http-inbound-adapters.schema.yml"

title: "Allora HTTP Inbound Adapters Collection Schema (v1)"
description: "Collection of HTTP inbound adapter definitions using v1 adapter object shape"
type: object
required: [ version, http-inbound-adapters ]
additionalProperties: false

properties:
  version:
    type: integer
    const: 1
    default: 1
  http-inbound-adapters:
    type: array
    minItems: 1
    description: "List of HTTP inbound adapter definitions (host/port/path/methods/request-channel required; id/reply-channel optional)."
    items:
      $ref: "local://schemas/v1/http-inbound-adapter.schema.yml#/properties/http-inbound-adapter"

examples:
  - version: 1
    http-inbound-adapters:
      - id: http.receiveGateway
        host: 127.0.0.1
        port: 8080
        path: /receiveGateway
        methods: [ POST ]
        request-channel: receiveChannel
        reply-channel: replyChannel
      - host: 0.0.0.0
        port: 8081
        path: /orders
        methods: [ POST, GET ]
        request-channel: inbound.orders

