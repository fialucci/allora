# Allora HTTP Outbound Adapter DSL Schema (v1)
# Defines a single HTTP outbound adapter that maps an internal Exchange/Message
# to an outbound HTTP request (client-side dispatch). Runtime wiring may later
# allow automatic channel-driven dispatch; this schema focuses on adapter shape.
#
# Breaking change in Allora 0.0.9: the `host` + `port` + `base-path` triple was
# replaced by a single `url:` field that must include the scheme. Both
# `http://` and `https://` are accepted; TLS uses `rustls` with the system
# trust store.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "local://schemas/v1/http-outbound-adapter.schema.yml"

title: "Allora HTTP Outbound Adapter Specification v1"
description: "HTTP client endpoint configuration for dispatching messages outward"
type: object
required: [ version, http-outbound-adapter ]
additionalProperties: false

properties:
  version:
    type: integer
    const: 1
    description: "Schema version (must be 1)."

  http-outbound-adapter:
    type: object
    description: "HTTP outbound adapter definition block"
    required: [ url ]
    additionalProperties: false
    properties:
      id:
        type: string
        minLength: 1
        description: |
          Optional explicit adapter identifier. Must be a non-empty string if provided.
          Uniqueness is enforced during build. When omitted the runtime may assign a deterministic auto id.
      url:
        type: string
        minLength: 1
        format: uri
        pattern: '^https?://'
        description: |
          Full target URL the HTTP client dials. Must include the scheme;
          both `http://` and `https://` are supported.
          Replaces the legacy `host` + `port` + `base-path` triple (removed in 0.0.9).
      method:
        type: string
        enum: [ GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD ]
        description: "HTTP method for outbound requests."
        default: POST
      use-out-msg:
        type: boolean
        description: |
          If true (default), adapter serializes exchange.out_msg when present,
          falling back to exchange.in_msg. If false, always uses exchange.in_msg.
        default: true
      from:
        type: string
        minLength: 1
        description: |
          Channel-driven dispatch: when present, the runtime subscribes this
          adapter to the named inbound channel and dispatches each arriving
          exchange. When absent, the adapter is static-only — accessed via
          `rt.http_outbound_adapters()` and invoked manually by app code.
      to:
        type: string
        minLength: 1
        description: |
          Outbound channel for the post-dispatch exchange. Ignored when `from`
          is absent. When `from` is set and `to` is omitted, dispatch is
          fire-and-forget (response logged at debug, message dropped). When
          both are set, the response body becomes `in_msg.payload` (Text)
          and the response status lands in `dispatch-result.status-code` /
          `dispatch-result.acknowledged` headers.
      # Future fields (reserved): headers, timeout-ms, retry-policy, auth-ref

examples:
  - version: 1
    http-outbound-adapter:
      id: http.outboundEcho
      url: http://127.0.0.1:18080/api/echo
      method: POST
      use-out-msg: true
  - version: 1
    http-outbound-adapter:
      url: https://10.0.0.5/v1
      method: GET
  - version: 1
    http-outbound-adapter:
      id: chain.submit
      url: https://devnet.fialucci.org/oracle/submissions
      method: POST
      from: signed_submissions
      to: chain_acks
