# Allora Service Activators Collection Schema (documentation-only, v1)
# Represents multiple service activator definitions sharing a single version declaration.
# Reuses the single activator schema's `service` object shape for each entry.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "local://schemas/v1/service-activators.schema.yml"

title: "Allora Service Activators Collection Schema (v1)"
description: "Collection of service activator definitions using v1 service activator object shape"
type: object
required: [ version, service-activators ]
additionalProperties: false

properties:
  version:
    type: integer
    const: 1
    default: 1
  service-activators:
    type: array
    minItems: 1
    description: "List of service activator definitions (ref-name/from/to required; id optional)."
    items:
      $ref: "local://schemas/v1/service-activator.schema.yml#/properties/service-activator"

examples:
  - version: 1
    service-activators:
      - id: svc.hello
        ref-name: src_hello_world   # example reference name
        from: inbound.orders
        to: vetted.orders
      - ref-name: other
        from: inbound.orders
        to: vetted.orders
