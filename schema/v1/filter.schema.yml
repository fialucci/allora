# Allora Filter DSL Schema (v1)
# Defines a single message filter that gates messages from one channel
# and optionally forwards accepted messages to an outbound channel.
# Validation is descriptive only; parsers enforce structure.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "local://schemas/v1/filter.schema.yml"

title: "Allora Filter Specification v1"
description: "Message Filter EIP: predicate over message headers/body with optional forwarding"
type: object
required: [ version, filter ]
additionalProperties: false

properties:
  version:
    type: integer
    const: 1
    description: "Schema version (must be 1)."

  filter:
    type: object
    description: "Filter definition block"
    required: [ from, when ]
    additionalProperties: false
    properties:
      id:
        type: string
        minLength: 1
        description: |
          Optional explicit filter identifier. Must be a non-empty string if provided.
          Uniqueness is enforced during build (duplicate ids cause an error). When omitted in a
          multi-filter build the runtime assigns a deterministic auto id of the form `filter:auto.N`.
      from:
        type: string
        minLength: 1
        description: "Inbound channel id the filter consumes from."
      to:
        type: string
        minLength: 1
        description: "Optional outbound channel id for accepted messages."
      when:
        type: string
        minLength: 1
        description: |
          Boolean expression over message context.
          Supported atoms:
            header("Key") == "Value"          - exact header match
            exists(header("Key"))             - header presence
            body.contains("text")             - substring search in body
            body.json("$.foo.bar") == "value" - JSON body field equals literal
                                                (JSONPath dot navigation;
                                                 bool/number coerced to string;
                                                 also accepts `/foo/bar`
                                                 RFC 6901 pointer syntax)
          Operators: &&, ||, ==
          Examples:
            body.contains("KEEP") && exists(header("Trace-Id"))
            body.json("$.action") == "closed" && body.json("$.pull_request.merged") == "true"

examples:
  - version: 1
    filter:
      id: filt.orders
      from: inbound.orders
      to: vetted.orders
      when: body.contains("KEEP") && exists(header("Trace-Id"))
  - version: 1
    filter:
      from: inbound.audit
      when: exists(header("Audit-Flag")) && header("Audit-Flag") == "true"
  - version: 1
    filter:
      id: filt.pr_merged
      from: parsed_github_events
      to: pr_merged_events
      when: body.json("$.action") == "closed" && body.json("$.pull_request.merged") == "true"
