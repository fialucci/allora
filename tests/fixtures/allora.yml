# Top-level Allora configuration fixture (v1)
version: 1
channels:
  - kind: in_memory
    id: inbound.orders
  - kind: in_memory
    id: processed.orders
  - kind: in_memory
    id: error.deadletter
filters:
  - id: filt.orders
    from: inbound.orders
    to: processed.orders
    when: body.contains("KEEP") && exists(header("Trace-Id"))
