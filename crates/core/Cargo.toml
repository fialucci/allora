[package]
name = "allora-core"
version = "0.0.8"
edition = "2021"
license = "Apache-2.0"
authors = ["Allora Contributors"]
description = "Core primitives for Allora: messages, exchanges, channels, processors, patterns (EIP) for Rust integration flows."
repository = "https://github.com/fialucci/allora"
homepage = "https://github.com/fialucci/allora"
documentation = "https://docs.rs/allora-core"
readme = "README.md"
keywords = ["integration", "messaging", "routing", "eip", "patterns"]
categories = ["asynchronous", "network-programming"]

[lib]
name = "allora_core"
path = "src/lib.rs"

[dependencies]
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yaml = { version = "0.9" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
regex = { version = "1" }
once_cell = { version = "1.19" }
async-trait = { version = "0.1" }
tokio = { version = "1.39", features = ["rt", "rt-multi-thread", "sync"] }
