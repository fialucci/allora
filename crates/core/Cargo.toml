[package]
name = "allora-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Allora Contributors"]
description = "Core primitives for Allora: messages, exchanges, channels, processors, patterns (EIP) for Rust integration flows."
repository = "https://github.com/fialucci/allora"
homepage = "https://github.com/fialucci/allora"
documentation = "https://docs.rs/allora-core"
readme = "README.md"
keywords = ["integration", "eip", "messaging", "channel", "routing"]
categories = ["network-programming", "asynchronous"]

[lib]
name = "allora_core"
path = "src/lib.rs"

[features]
default = ["serde", "filter", "http"]
serde = ["dep:serde", "dep:serde_json", "dep:serde_yaml"]
filter = ["dep:regex", "dep:once_cell"]
http = []

[dependencies]
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
serde_yaml = { version = "0.9", optional = true }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
regex = { version = "1", optional = true }
once_cell = { version = "1.19", optional = true }
async-trait = { version = "0.1" }
tokio = { version = "1.39", features = ["rt", "rt-multi-thread", "sync"] }
