[package]
name = "allora-macros"
version = "0.0.10"
edition = "2021"
license = "Apache-2.0"
authors = ["Allora Contributors"]
description = "Procedural macros for Allora (#[service]) to register service activators via inventory."
repository = "https://github.com/fialucci/allora"
homepage = "https://github.com/fialucci/allora"
documentation = "https://docs.rs/allora-macros"
readme = "README.md"
keywords = ["proc-macro", "derive", "macros", "integration", "eip"]
categories = ["development-tools", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
